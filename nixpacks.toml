[phases.setup]
nixPkgs = ["nodejs_18"]

[phases.install]
cmds = [
    "cd frontend && npm ci --legacy-peer-deps"
]

[phases.build]
cmds = [
    "cd frontend && npm run build"
]

[start]
cmd = "cd frontend && npm run preview -- --port $PORT --host 0.0.0.0"

[variables]
NODE_ENV = "production"
VITE_API_URL = "https://backend-painel-universal-production.up.railway.app"