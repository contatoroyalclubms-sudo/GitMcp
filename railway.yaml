version: 2

services:
  backend:
    source: ./backend
    build:
      builder: NIXPACKS
    variables:
      NODE_ENV: production
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      PORT: 3001
      DATABASE_URL: ${{Postgres.DATABASE_URL}}
      FRONTEND_URL: ${{frontend.url}}
    healthcheck:
      path: /health
      port: 3001
    
  frontend:
    source: .
    build:
      builder: NIXPACKS
    variables:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${{backend.url}}
    healthcheck:
      path: /
      port: 3000

databases:
  - type: postgresql
    name: postgres
