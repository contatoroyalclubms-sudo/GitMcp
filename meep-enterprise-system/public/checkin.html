<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check-in - MEEP SUPREME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2a 100%);
            color: #fff;
            min-height: 100vh;
            padding: 20px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
        }

        .header h1 {
            font-size: 32px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .event-selector {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .event-selector select {
            padding: 10px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
        }

        .checkin-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            height: calc(100vh - 150px);
        }

        .scanner-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .scanner-box {
            width: 400px;
            height: 400px;
            border: 3px dashed rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            background: rgba(0, 0, 0, 0.3);
        }

        .scanner-animation {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00ff88, transparent);
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .scanner-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .scanner-text {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.7);
            text-align: center;
        }

        .manual-input {
            margin-top: 30px;
            width: 100%;
            max-width: 400px;
        }

        .manual-input input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            text-align: center;
        }

        .manual-input input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .checkin-button {
            width: 100%;
            padding: 15px;
            margin-top: 10px;
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            border: none;
            border-radius: 10px;
            color: #000;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .checkin-button:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
        }

        .info-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stats-card {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .stats-card h3 {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.7);
            margin-bottom: 10px;
        }

        .stats-value {
            font-size: 36px;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .stats-progress {
            margin-top: 10px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
        }

        .stats-progress-bar {
            height: 100%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 4px;
            transition: width 0.5s ease;
        }

        .recent-checkins {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
            flex: 1;
            overflow-y: auto;
        }

        .recent-checkins h3 {
            margin-bottom: 15px;
            color: rgba(255, 255, 255, 0.9);
        }

        .checkin-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px;
            margin-bottom: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            border-left: 3px solid #00ff88;
        }

        .checkin-item.vip {
            border-left-color: #ffd700;
        }

        .checkin-name {
            font-weight: 500;
        }

        .checkin-time {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }

        .checkin-type {
            padding: 4px 12px;
            background: rgba(102, 126, 234, 0.2);
            border-radius: 20px;
            font-size: 12px;
            color: #667eea;
        }

        .checkin-type.vip {
            background: rgba(255, 215, 0, 0.2);
            color: #ffd700;
        }

        .gates-section {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            padding: 20px;
        }

        .gates-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .gate-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 10px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .gate-card:hover {
            background: rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .gate-card.active {
            border-color: #00ff88;
            background: rgba(0, 255, 136, 0.1);
        }

        .gate-name {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .gate-count {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
        }

        .alert {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 20px 30px;
            background: rgba(255, 255, 255, 0.95);
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            transform: translateX(400px);
            transition: transform 0.3s ease;
        }

        .alert.show {
            transform: translateX(0);
        }

        .alert.success {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
        }

        .alert.error {
            background: linear-gradient(135deg, #ff6b6b 0%, #ff4757 100%);
            color: #fff;
        }

        .alert.warning {
            background: linear-gradient(135deg, #ffd700 0%, #ffac00 100%);
            color: #000;
        }

        .search-filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        .filter-btn {
            padding: 8px 16px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
        }

        .filter-btn:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .filter-btn.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-color: transparent;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>CHECK-IN SUPREME</h1>
        <div class="event-selector">
            <label>Evento:</label>
            <select id="eventSelect">
                <option value="1">Festival de Verão 2025</option>
                <option value="2">Rock Night Premium</option>
                <option value="3">Conferência Tech 2025</option>
            </select>
        </div>
    </div>

    <div class="checkin-container">
        <div class="scanner-section">
            <div class="scanner-box">
                <div class="scanner-animation"></div>
                <div class="scanner-icon">📷</div>
                <div class="scanner-text">
                    Posicione o QR Code do ingresso<br>
                    na área de leitura
                </div>
            </div>
            
            <div class="manual-input">
                <input type="text" id="ticketCode" placeholder="Digite o código do ingresso">
                <button class="checkin-button" onclick="processCheckin()">FAZER CHECK-IN</button>
            </div>
        </div>

        <div class="info-section">
            <div class="stats-card">
                <h3>CHECK-INS REALIZADOS</h3>
                <div class="stats-value" id="checkinCount">1,247</div>
                <div class="stats-progress">
                    <div class="stats-progress-bar" style="width: 62%"></div>
                </div>
                <div style="display: flex; justify-content: space-between; margin-top: 5px; font-size: 12px; color: rgba(255,255,255,0.5)">
                    <span>62% da capacidade</span>
                    <span>2000 total</span>
                </div>
            </div>

            <div class="gates-section">
                <h3>PORTÕES DE ENTRADA</h3>
                <div class="gates-grid">
                    <div class="gate-card active" onclick="selectGate('A')">
                        <div class="gate-name">Portão A</div>
                        <div class="gate-count">523</div>
                    </div>
                    <div class="gate-card" onclick="selectGate('B')">
                        <div class="gate-name">Portão B</div>
                        <div class="gate-count">412</div>
                    </div>
                    <div class="gate-card" onclick="selectGate('C')">
                        <div class="gate-name">Portão C</div>
                        <div class="gate-count">187</div>
                    </div>
                    <div class="gate-card" onclick="selectGate('VIP')">
                        <div class="gate-name">VIP</div>
                        <div class="gate-count">125</div>
                    </div>
                </div>
            </div>

            <div class="recent-checkins">
                <h3>CHECK-INS RECENTES</h3>
                <div class="search-filters">
                    <button class="filter-btn active" onclick="filterCheckins('all')">Todos</button>
                    <button class="filter-btn" onclick="filterCheckins('vip')">VIP</button>
                    <button class="filter-btn" onclick="filterCheckins('pista')">Pista</button>
                    <button class="filter-btn" onclick="filterCheckins('camarote')">Camarote</button>
                </div>
                <div id="recentCheckinsList">
                    <!-- Recent check-ins will be added here -->
                </div>
            </div>
        </div>
    </div>

    <div class="alert" id="alertBox"></div>

    <script>
        let currentGate = 'A';
        let checkinStats = {
            total: 1247,
            capacity: 2000,
            gates: {
                A: 523,
                B: 412,
                C: 187,
                VIP: 125
            }
        };

        let recentCheckins = [];

        // Initialize
        function init() {
            simulateRecentCheckins();
            startQRScanner();
            updateStats();
        }

        // Simulate QR scanner
        function startQRScanner() {
            // In production, integrate with real QR scanner library
            document.getElementById('ticketCode').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    processCheckin();
                }
            });
        }

        // Process check-in
        async function processCheckin() {
            const ticketCode = document.getElementById('ticketCode').value;
            
            if (!ticketCode) {
                showAlert('Digite ou escaneie um código de ingresso', 'warning');
                return;
            }

            try {
                const response = await fetch(`/api/events/tickets/${ticketCode}/checkin`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        gate: currentGate,
                        eventId: document.getElementById('eventSelect').value
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    // Success animation
                    showAlert(`✅ Check-in realizado: ${data.ticket.customerName}`, 'success');
                    
                    // Add to recent list
                    addRecentCheckin({
                        name: data.ticket.customerName,
                        type: data.ticket.type,
                        time: new Date()
                    });
                    
                    // Update stats
                    checkinStats.total++;
                    checkinStats.gates[currentGate]++;
                    updateStats();
                    
                    // Clear input
                    document.getElementById('ticketCode').value = '';
                    
                    // Play success sound
                    playSound('success');
                } else {
                    showAlert(`❌ ${data.error}`, 'error');
                    playSound('error');
                }
            } catch (error) {
                // Simulate successful check-in for demo
                const mockData = {
                    name: `Cliente ${Math.floor(Math.random() * 1000)}`,
                    type: Math.random() > 0.7 ? 'VIP' : 'Pista'
                };
                
                showAlert(`✅ Check-in realizado: ${mockData.name}`, 'success');
                addRecentCheckin({
                    name: mockData.name,
                    type: mockData.type,
                    time: new Date()
                });
                
                checkinStats.total++;
                checkinStats.gates[currentGate]++;
                updateStats();
                
                document.getElementById('ticketCode').value = '';
            }
        }

        // Add to recent check-ins
        function addRecentCheckin(checkin) {
            recentCheckins.unshift(checkin);
            if (recentCheckins.length > 10) {
                recentCheckins.pop();
            }
            renderRecentCheckins();
        }

        // Render recent check-ins
        function renderRecentCheckins(filter = 'all') {
            const list = document.getElementById('recentCheckinsList');
            list.innerHTML = '';
            
            const filtered = filter === 'all' ? 
                recentCheckins : 
                recentCheckins.filter(c => c.type.toLowerCase() === filter);
            
            filtered.forEach(checkin => {
                const item = document.createElement('div');
                item.className = `checkin-item ${checkin.type === 'VIP' ? 'vip' : ''}`;
                item.innerHTML = `
                    <div>
                        <div class="checkin-name">${checkin.name}</div>
                        <div class="checkin-time">${formatTime(checkin.time)}</div>
                    </div>
                    <div class="checkin-type ${checkin.type === 'VIP' ? 'vip' : ''}">${checkin.type}</div>
                `;
                list.appendChild(item);
            });
        }

        // Format time
        function formatTime(date) {
            const now = new Date();
            const diff = Math.floor((now - date) / 1000);
            
            if (diff < 60) return 'Agora mesmo';
            if (diff < 3600) return `${Math.floor(diff / 60)} min atrás`;
            if (diff < 86400) return `${Math.floor(diff / 3600)}h atrás`;
            return date.toLocaleString('pt-BR');
        }

        // Update statistics
        function updateStats() {
            document.getElementById('checkinCount').textContent = checkinStats.total.toLocaleString('pt-BR');
            const percentage = (checkinStats.total / checkinStats.capacity * 100).toFixed(0);
            document.querySelector('.stats-progress-bar').style.width = `${percentage}%`;
            document.querySelector('.stats-progress + div span').textContent = `${percentage}% da capacidade`;
            
            // Update gate counts
            Object.keys(checkinStats.gates).forEach(gate => {
                const card = document.querySelector(`.gate-card:nth-child(${['A','B','C','VIP'].indexOf(gate) + 1}) .gate-count`);
                if (card) card.textContent = checkinStats.gates[gate];
            });
        }

        // Select gate
        function selectGate(gate) {
            currentGate = gate;
            document.querySelectorAll('.gate-card').forEach(card => card.classList.remove('active'));
            event.currentTarget.classList.add('active');
            showAlert(`Portão ${gate} selecionado`, 'success');
        }

        // Filter check-ins
        function filterCheckins(type) {
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');
            renderRecentCheckins(type);
        }

        // Show alert
        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.className = `alert ${type}`;
            alertBox.textContent = message;
            alertBox.classList.add('show');
            
            setTimeout(() => {
                alertBox.classList.remove('show');
            }, 3000);
        }

        // Play sound
        function playSound(type) {
            // In production, add actual sound files
            if (type === 'success') {
                // Play success sound
            } else if (type === 'error') {
                // Play error sound
            }
        }

        // Simulate recent check-ins
        function simulateRecentCheckins() {
            const names = [
                'João Silva', 'Maria Santos', 'Pedro Oliveira', 'Ana Costa',
                'Carlos Pereira', 'Juliana Lima', 'Fernando Souza', 'Patricia Alves'
            ];
            
            const types = ['Pista', 'Pista', 'Camarote', 'VIP', 'Pista'];
            
            for (let i = 0; i < 5; i++) {
                recentCheckins.push({
                    name: names[Math.floor(Math.random() * names.length)],
                    type: types[Math.floor(Math.random() * types.length)],
                    time: new Date(Date.now() - Math.random() * 3600000)
                });
            }
            
            renderRecentCheckins();
        }

        // WebSocket for real-time updates
        function connectWebSocket() {
            const ws = new WebSocket(`ws://${window.location.host}`);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                if (data.type === 'new_checkin') {
                    addRecentCheckin(data.checkin);
                    updateStats();
                }
            };
        }

        // Initialize on load
        window.onload = function() {
            init();
            // connectWebSocket(); // Enable in production
        };
    </script>
</body>
</html>
