<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDV - MEEP SUPREME</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0a2a 100%);
            color: #fff;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .pdv-container {
            display: grid;
            grid-template-columns: 1fr 400px;
            height: 100vh;
            gap: 20px;
            padding: 20px;
        }

        .products-section {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .search-bar {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            display: flex;
            gap: 10px;
        }

        .search-bar input {
            flex: 1;
            background: transparent;
            border: none;
            color: #fff;
            font-size: 16px;
            outline: none;
        }

        .search-bar input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .categories {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            padding: 10px 0;
        }

        .category-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .category-btn:hover {
            transform: scale(1.05);
        }

        .category-btn.active {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        }

        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 15px;
            overflow-y: auto;
            max-height: calc(100vh - 250px);
            padding: 10px;
        }

        .product-card {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
        }

        .product-card:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.3);
        }

        .product-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .product-name {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .product-price {
            font-size: 18px;
            font-weight: bold;
            color: #00ff88;
        }

        .cart-section {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .cart-item {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 8px;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-name {
            font-size: 14px;
            margin-bottom: 5px;
        }

        .cart-item-price {
            color: #00ff88;
            font-weight: bold;
        }

        .cart-item-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .qty-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.3);
            background: transparent;
            color: #fff;
            cursor: pointer;
            transition: all 0.2s;
        }

        .qty-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .cart-totals {
            padding-top: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .total-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .total-row.grand-total {
            font-size: 24px;
            font-weight: bold;
            color: #00ff88;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid rgba(255, 255, 255, 0.2);
        }

        .payment-methods {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
        }

        .payment-btn {
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .payment-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: scale(1.05);
        }

        .payment-btn.cash { border-color: #00ff88; }
        .payment-btn.credit { border-color: #667eea; }
        .payment-btn.debit { border-color: #764ba2; }
        .payment-btn.pix { border-color: #f093fb; }
        .payment-btn.voucher { border-color: #f5576c; }
        .payment-btn.cashless { border-color: #ffa500; }

        .payment-icon {
            font-size: 24px;
        }

        .payment-label {
            font-size: 12px;
        }

        .payment-amount {
            font-size: 14px;
            font-weight: bold;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-cancel {
            background: rgba(255, 0, 0, 0.2);
            color: #ff6b6b;
            border: 1px solid #ff6b6b;
        }

        .btn-cancel:hover {
            background: rgba(255, 0, 0, 0.3);
        }

        .btn-finish {
            background: linear-gradient(135deg, #00ff88 0%, #00cc6a 100%);
            color: #000;
        }

        .btn-finish:hover {
            transform: scale(1.05);
            box-shadow: 0 10px 30px rgba(0, 255, 136, 0.3);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border-radius: 20px;
            padding: 30px;
            max-width: 500px;
            width: 90%;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .modal-header {
            font-size: 24px;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-body {
            margin: 20px 0;
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            margin-bottom: 15px;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }
    </style>
</head>
<body>
    <div class="pdv-container">
        <div class="products-section">
            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="Buscar produto...">
                <button onclick="searchProducts()" style="background: transparent; border: none; color: #fff; cursor: pointer;">🔍</button>
            </div>
            
            <div class="categories" id="categoriesContainer">
                <button class="category-btn active" onclick="filterCategory('all')">TODOS</button>
                <button class="category-btn" onclick="filterCategory('bebidas')">BEBIDAS</button>
                <button class="category-btn" onclick="filterCategory('alimentos')">ALIMENTOS</button>
                <button class="category-btn" onclick="filterCategory('diversos')">DIVERSOS</button>
            </div>
            
            <div class="products-grid" id="productsGrid">
                <!-- Products will be loaded here -->
            </div>
        </div>
        
        <div class="cart-section">
            <div class="cart-header">
                <h2>CARRINHO</h2>
                <span id="transactionCode">TRX-000000</span>
            </div>
            
            <div class="cart-items" id="cartItems">
                <!-- Cart items will be added here -->
            </div>
            
            <div class="cart-totals">
                <div class="total-row">
                    <span>Subtotal:</span>
                    <span id="subtotal">R$ 0,00</span>
                </div>
                <div class="total-row">
                    <span>Desconto:</span>
                    <span id="discount">R$ 0,00</span>
                </div>
                <div class="total-row grand-total">
                    <span>TOTAL:</span>
                    <span id="grandTotal">R$ 0,00</span>
                </div>
            </div>
            
            <div class="payment-methods" id="paymentMethods">
                <button class="payment-btn cash" onclick="selectPayment('cash')">
                    <span class="payment-icon">💵</span>
                    <span class="payment-label">DINHEIRO</span>
                    <span class="payment-amount">R$ 0,00</span>
                </button>
                <button class="payment-btn credit" onclick="selectPayment('credit')">
                    <span class="payment-icon">💳</span>
                    <span class="payment-label">CRÉDITO</span>
                    <span class="payment-amount">R$ 0,00</span>
                </button>
                <button class="payment-btn debit" onclick="selectPayment('debit')">
                    <span class="payment-icon">💳</span>
                    <span class="payment-label">DÉBITO</span>
                    <span class="payment-amount">R$ 0,00</span>
                </button>
                <button class="payment-btn pix" onclick="selectPayment('pix')">
                    <span class="payment-icon">📱</span>
                    <span class="payment-label">PIX</span>
                    <span class="payment-amount">R$ 0,00</span>
                </button>
                <button class="payment-btn voucher" onclick="selectPayment('voucher')">
                    <span class="payment-icon">🎫</span>
                    <span class="payment-label">VOUCHER</span>
                    <span class="payment-amount">R$ 0,00</span>
                </button>
                <button class="payment-btn cashless" onclick="selectPayment('cashless')">
                    <span class="payment-icon">💳</span>
                    <span class="payment-label">CASHLESS</span>
                    <span class="payment-amount">R$ 0,00</span>
                </button>
            </div>
            
            <div class="action-buttons">
                <button class="action-btn btn-cancel" onclick="cancelTransaction()">CANCELAR</button>
                <button class="action-btn btn-finish" onclick="finishTransaction()">FINALIZAR</button>
            </div>
        </div>
    </div>
    
    <!-- Payment Modal -->
    <div class="modal" id="paymentModal">
        <div class="modal-content">
            <div class="modal-header" id="modalTitle">Pagamento</div>
            <div class="modal-body" id="modalBody">
                <!-- Dynamic content based on payment method -->
            </div>
            <div class="modal-buttons">
                <button class="modal-btn btn-cancel" onclick="closeModal()">Cancelar</button>
                <button class="modal-btn btn-finish" onclick="processPayment()">Confirmar</button>
            </div>
        </div>
    </div>
    
    <script>
        let currentTransaction = null;
        let cart = [];
        let products = [];
        let payments = [];
        let selectedPaymentMethod = null;
        
        // Initialize PDV
        async function initPDV() {
            await loadProducts();
            await openTransaction();
        }
        
        // Load products
        async function loadProducts() {
            try {
                const response = await fetch('/api/products', {
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                if (data.success) {
                    products = data.products;
                    displayProducts(products);
                }
            } catch (error) {
                console.error('Error loading products:', error);
            }
        }
        
        // Display products
        function displayProducts(productsToShow) {
            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            
            productsToShow.forEach(product => {
                const card = document.createElement('div');
                card.className = 'product-card';
                card.onclick = () => addToCart(product);
                card.innerHTML = `
                    <div class="product-icon">${getProductIcon(product.category)}</div>
                    <div class="product-name">${product.name}</div>
                    <div class="product-price">R$ ${product.price.toFixed(2)}</div>
                `;
                grid.appendChild(card);
            });
        }
        
        // Get product icon based on category
        function getProductIcon(category) {
            const icons = {
                'bebidas': '🥤',
                'alimentos': '🍔',
                'doces': '🍬',
                'diversos': '📦',
                'default': '📦'
            };
            return icons[category?.toLowerCase()] || icons.default;
        }
        
        // Open new transaction
        async function openTransaction() {
            try {
                const response = await fetch('/api/pdv/transactions/open', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        eventId: localStorage.getItem('currentEventId')
                    })
                });
                const data = await response.json();
                if (data.success) {
                    currentTransaction = data.transaction;
                    document.getElementById('transactionCode').textContent = data.transaction.code;
                }
            } catch (error) {
                console.error('Error opening transaction:', error);
            }
        }
        
        // Add product to cart
        async function addToCart(product) {
            if (!currentTransaction) {
                alert('Nenhuma transação aberta');
                return;
            }
            
            try {
                const response = await fetch(`/api/pdv/transactions/${currentTransaction.id}/items`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify({
                        productId: product.id,
                        quantity: 1
                    })
                });
                const data = await response.json();
                if (data.success) {
                    cart.push({
                        ...product,
                        itemId: data.item.id,
                        quantity: 1
                    });
                    updateCartDisplay();
                }
            } catch (error) {
                console.error('Error adding to cart:', error);
            }
        }
        
        // Update cart display
        function updateCartDisplay() {
            const cartContainer = document.getElementById('cartItems');
            cartContainer.innerHTML = '';
            
            let subtotal = 0;
            
            cart.forEach(item => {
                const itemElement = document.createElement('div');
                itemElement.className = 'cart-item';
                itemElement.innerHTML = `
                    <div class="cart-item-info">
                        <div class="cart-item-name">${item.name}</div>
                        <div class="cart-item-price">R$ ${(item.price * item.quantity).toFixed(2)}</div>
                    </div>
                    <div class="cart-item-controls">
                        <button class="qty-btn" onclick="updateQuantity('${item.itemId}', -1)">-</button>
                        <span>${item.quantity}</span>
                        <button class="qty-btn" onclick="updateQuantity('${item.itemId}', 1)">+</button>
                    </div>
                `;
                cartContainer.appendChild(itemElement);
                subtotal += item.price * item.quantity;
            });
            
            document.getElementById('subtotal').textContent = `R$ ${subtotal.toFixed(2)}`;
            document.getElementById('grandTotal').textContent = `R$ ${subtotal.toFixed(2)}`;
        }
        
        // Filter by category
        function filterCategory(category) {
            const buttons = document.querySelectorAll('.category-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            if (category === 'all') {
                displayProducts(products);
            } else {
                const filtered = products.filter(p => p.category?.toLowerCase() === category);
                displayProducts(filtered);
            }
        }
        
        // Search products
        function searchProducts() {
            const searchTerm = document.getElementById('searchInput').value.toLowerCase();
            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(searchTerm) ||
                p.category?.toLowerCase().includes(searchTerm)
            );
            displayProducts(filtered);
        }
        
        // Select payment method
        function selectPayment(method) {
            selectedPaymentMethod = method;
            const modal = document.getElementById('paymentModal');
            const modalTitle = document.getElementById('modalTitle');
            const modalBody = document.getElementById('modalBody');
            
            switch(method) {
                case 'cash':
                    modalTitle.textContent = 'Pagamento em Dinheiro';
                    modalBody.innerHTML = `
                        <input type="number" class="modal-input" id="cashAmount" 
                               placeholder="Valor recebido" step="0.01">
                    `;
                    break;
                case 'pix':
                    modalTitle.textContent = 'Pagamento via PIX';
                    modalBody.innerHTML = `
                        <input type="text" class="modal-input" id="pixKey" 
                               placeholder="Chave PIX ou código">
                    `;
                    break;
                case 'cashless':
                    modalTitle.textContent = 'Pagamento Cashless';
                    modalBody.innerHTML = `
                        <input type="text" class="modal-input" id="cardNumber" 
                               placeholder="Número do cartão">
                    `;
                    break;
                case 'credit':
                case 'debit':
                    modalTitle.textContent = `Pagamento ${method === 'credit' ? 'Crédito' : 'Débito'}`;
                    modalBody.innerHTML = `
                        <input type="text" class="modal-input" id="cardAuth" 
                               placeholder="Código de autorização">
                    `;
                    break;
                case 'voucher':
                    modalTitle.textContent = 'Pagamento com Voucher';
                    modalBody.innerHTML = `
                        <input type="text" class="modal-input" id="voucherCode" 
                               placeholder="Código do voucher">
                    `;
                    break;
            }
            
            modal.classList.add('active');
        }
        
        // Process payment
        async function processPayment() {
            if (!currentTransaction || !selectedPaymentMethod) return;
            
            const total = parseFloat(document.getElementById('grandTotal').textContent.replace('R$ ', '').replace(',', '.'));
            let paymentData = {
                method: selectedPaymentMethod,
                amount: total
            };
            
            // Add specific payment data
            switch(selectedPaymentMethod) {
                case 'cash':
                    paymentData.amount = parseFloat(document.getElementById('cashAmount').value);
                    break;
                case 'pix':
                    paymentData.pixKey = document.getElementById('pixKey').value;
                    break;
                case 'cashless':
                    paymentData.cardNumber = document.getElementById('cardNumber').value;
                    break;
                case 'credit':
                case 'debit':
                    paymentData.authorizationCode = document.getElementById('cardAuth').value;
                    break;
                case 'voucher':
                    paymentData.voucherCode = document.getElementById('voucherCode').value;
                    break;
            }
            
            try {
                const response = await fetch(`/api/pdv/transactions/${currentTransaction.id}/payment`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    },
                    body: JSON.stringify(paymentData)
                });
                const data = await response.json();
                
                if (data.success) {
                    closeModal();
                    if (data.transaction.status === 'completed') {
                        alert('Venda finalizada com sucesso!');
                        resetPDV();
                    } else {
                        payments.push(data.payment);
                        updatePaymentDisplay();
                    }
                } else {
                    alert(data.error);
                }
            } catch (error) {
                console.error('Error processing payment:', error);
                alert('Erro ao processar pagamento');
            }
        }
        
        // Update payment display
        function updatePaymentDisplay() {
            const total = parseFloat(document.getElementById('grandTotal').textContent.replace('R$ ', '').replace(',', '.'));
            const totalPaid = payments.reduce((sum, p) => sum + p.amount, 0);
            const remaining = total - totalPaid;
            
            document.querySelectorAll('.payment-btn').forEach(btn => {
                const method = btn.className.split(' ')[1];
                const methodPayments = payments.filter(p => p.method === method);
                const methodTotal = methodPayments.reduce((sum, p) => sum + p.amount, 0);
                btn.querySelector('.payment-amount').textContent = `R$ ${methodTotal.toFixed(2)}`;
            });
            
            if (remaining <= 0) {
                alert('Pagamento completo!');
                resetPDV();
            }
        }
        
        // Cancel transaction
        async function cancelTransaction() {
            if (!currentTransaction) return;
            
            if (!confirm('Deseja cancelar a venda?')) return;
            
            try {
                const response = await fetch(`/api/pdv/transactions/${currentTransaction.id}/cancel`, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${localStorage.getItem('token')}`
                    }
                });
                const data = await response.json();
                
                if (data.success) {
                    alert('Venda cancelada');
                    resetPDV();
                }
            } catch (error) {
                console.error('Error cancelling transaction:', error);
            }
        }
        
        // Finish transaction
        function finishTransaction() {
            const total = parseFloat(document.getElementById('grandTotal').textContent.replace('R$ ', '').replace(',', '.'));
            const totalPaid = payments.reduce((sum, p) => sum + p.amount, 0);
            
            if (totalPaid < total) {
                alert(`Ainda faltam R$ ${(total - totalPaid).toFixed(2)} para completar o pagamento`);
                return;
            }
            
            alert('Venda finalizada com sucesso!');
            resetPDV();
        }
        
        // Reset PDV
        function resetPDV() {
            cart = [];
            payments = [];
            currentTransaction = null;
            selectedPaymentMethod = null;
            updateCartDisplay();
            openTransaction();
        }
        
        // Close modal
        function closeModal() {
            document.getElementById('paymentModal').classList.remove('active');
        }
        
        // Update quantity
        function updateQuantity(itemId, change) {
            const item = cart.find(i => i.itemId === itemId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.itemId !== itemId);
                }
                updateCartDisplay();
            }
        }
        
        // Initialize on load
        window.onload = initPDV;
    </script>
</body>
</html>
