[build]
builder = "NIXPACKS"
buildCommand = "npm install"
watchPatterns = ["**/*.js", "**/*.json"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

[environment]
NODE_ENV = "production"
PORT = "${{RAILWAY_PORT}}"

[[services]]
name = "api"
source = "."

[services.deploy]
startCommand = "npm start"

[services.healthcheck]
path = "/health"
timeout = 30
interval = 10
retries = 3

[services.resources]
cpu = 500
memory = 512