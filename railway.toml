[build]
builder = "DOCKERFILE"
dockerfilePath = "./Dockerfile"

[deploy]
healthcheckPath = "/healthz"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
numReplicas = 1

[environment]
NODE_ENV = "production"
PORT = "3000"

[[services]]
name = "api"
source = "."

[services.deploy]
startCommand = "/app/start.sh"

[services.healthcheck]
path = "/healthz"
timeout = 30
interval = 10
retries = 3

[services.resources]
cpu = 500
memory = 512